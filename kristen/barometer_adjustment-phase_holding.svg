<svg viewBox="0 0 880 1060" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="880" height="1060" fill="#ffffff"/>

  <!-- PAGE HEADER -->
  <text x="440" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2e4a">Side Effect Check-In: Still in the Adjustment Period</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#475569">You told us your child is in the adjustment period with no more scheduled dose increases.</text>
  <line x1="40" y1="74" x2="840" y2="74" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- MINI HILL CURVE: x=40-840, y=88-236 -->
  <rect x="40"  y="88" width="380" height="148" fill="#fff8f0"/>
  <rect x="420" y="88" width="420" height="148" fill="#f0fdf4"/>
  <rect x="40" y="88" width="800" height="148" rx="8" ry="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="420" y1="88" x2="420" y2="236" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Highlight band days 6-14: x=210 to x=420 -->
  <rect x="210" y="88" width="210" height="148" fill="#fef08a" opacity="0.45"/>
  <line x1="210" y1="83" x2="420" y2="83" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="210" y1="83" x2="210" y2="91" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="420" y1="83" x2="420" y2="91" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="315" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Days 6-14</text>

  <!-- X-axis -->
  <line x1="40" y1="236" x2="840" y2="236" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40"  y1="236" x2="40"  y2="243" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="150" y1="236" x2="150" y2="243" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="210" y1="236" x2="210" y2="243" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="420" y1="236" x2="420" y2="243" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="650" y1="236" x2="650" y2="243" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40"  y="254" text-anchor="middle" font-size="9.5" fill="#64748b">Dose</text>
  <text x="40"  y="265" text-anchor="middle" font-size="9.5" fill="#64748b">increase</text>
  <text x="150" y="254" text-anchor="middle" font-size="9.5" fill="#64748b">Days 1-3</text>
  <text x="315" y="254" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ca8a04">Days 6-14</text>
  <text x="650" y="254" text-anchor="middle" font-size="9.5" fill="#15803d">Week 3+</text>
  <text x="16" y="165" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90,16,165)">Side effect level</text>

  <!-- Hill curve -->
  <path d="M 40,215 C 75,215 110,106 165,112 C 220,118 265,156 318,192 C 358,210 392,215 420,214 C 490,212 600,213 840,213 L 840,236 L 40,236 Z" fill="#fde8c8" opacity="0.55"/>
  <path d="M 40,215 C 75,215 110,106 165,112 C 220,118 265,156 318,192 C 358,210 392,215 420,214 C 490,212 600,213 840,213" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="165" cy="112" r="4" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="650" cy="213" r="4" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="46" y="93" width="128" height="18" rx="4" fill="#fff8f0" opacity="0.9"/>
  <text x="110" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">Adjustment Period</text>
  <rect x="428" y="93" width="96" height="18" rx="4" fill="#f0fdf4" opacity="0.9"/>
  <text x="476" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Steady State</text>

  <!-- INSTRUCTION NOTE -->
  <rect x="40" y="278" width="800" height="32" rx="9" ry="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#1e3a5f"><tspan font-weight="700" fill="#1e40af">When rating below, think about how your child is doing </tspan><tspan fill="#1e3a5f">towards the end of the adjustment period.</tspan></text>

  <!--
    BAROMETER: x=140-200, y=336-906 (570px)
    Segments:
      L5: y=336-366  (30px)  center=351
      L4: y=366-426  (60px)  center=396
      L3: y=426-506  (80px)  center=466
      L2: y=506-606  (100px) center=556
      L1: y=606-746  (140px) center=676
      L0: y=746-906  (160px) center=826

    Cards: x=220-500 (width=280)
    Implication bubbles: x=522-782 (width=260)
  -->

  <!-- SEGMENTS -->
  <rect x="140" y="746" width="60" height="160" fill="#22c55e"/>
  <rect x="140" y="606" width="60" height="140" fill="#86efac"/>
  <rect x="140" y="506" width="60" height="100" fill="#fde68a"/>
  <rect x="140" y="426" width="60" height="80"  fill="#fb923c"/>
  <rect x="140" y="366" width="60" height="60"  fill="#ef4444"/>
  <rect x="140" y="336" width="60" height="30"  fill="#991b1b"/>
  <rect x="140" y="336" width="60" height="570" rx="6" ry="6" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Dividers -->
  <line x1="140" y1="366" x2="200" y2="366" stroke="#ffffff" stroke-width="2"/>
  <line x1="140" y1="426" x2="200" y2="426" stroke="#ffffff" stroke-width="2"/>
  <line x1="140" y1="506" x2="200" y2="506" stroke="#ffffff" stroke-width="2"/>
  <line x1="140" y1="606" x2="200" y2="606" stroke="#ffffff" stroke-width="2"/>
  <line x1="140" y1="746" x2="200" y2="746" stroke="#ffffff" stroke-width="2"/>

  <!-- Level numbers centered on segment midpoints -->
  <text x="170" y="356" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">5</text>
  <text x="170" y="401" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
  <text x="170" y="471" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
  <text x="170" y="561" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f">2</text>
  <text x="170" y="681" text-anchor="middle" font-size="17" font-weight="800" fill="#14532d">1</text>
  <text x="170" y="831" text-anchor="middle" font-size="19" font-weight="800" fill="#14532d">0</text>

  <!-- More severe / Better tolerated -->
  <text x="170" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">More severe</text>
  <line x1="170" y1="325" x2="170" y2="333" stroke="#991b1b" stroke-width="1.5"/>
  <polygon points="170,336 165,329 175,329" fill="#991b1b"/>

  <text x="170" y="922" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Better tolerated</text>
  <line x1="170" y1="910" x2="170" y2="918" stroke="#15803d" stroke-width="1.5"/>
  <polygon points="170,907 165,915 175,915" fill="#15803d"/>

  <!-- Connectors bar to cards at segment centers -->
  <line x1="200" y1="351" x2="220" y2="351" stroke="#991b1b" stroke-width="1.8"/>
  <line x1="200" y1="396" x2="220" y2="396" stroke="#b91c1c" stroke-width="1.8"/>
  <line x1="200" y1="466" x2="220" y2="466" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="200" y1="556" x2="220" y2="556" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="200" y1="676" x2="220" y2="676" stroke="#16a34a" stroke-width="1.8"/>
  <line x1="200" y1="826" x2="220" y2="826" stroke="#22c55e" stroke-width="1.8"/>

  <!-- ── LABEL CARDS ── -->

  <!-- L5: center=351, card y=333, h=36 -->
  <rect x="220" y="333" width="280" height="36" rx="7" ry="7" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="234" y="347" font-size="11" font-weight="800" fill="#991b1b">Level 5 - Not a fit for my child.</text>
  <text x="234" y="362" font-size="10.5" fill="#7f1d1d">This medication has never felt right for my child.</text>

  <!-- L5 implication: center=351, bubble y=332, h=38 -->
  <line x1="500" y1="351" x2="516" y2="351" stroke="#991b1b" stroke-width="1.3" stroke-dasharray="3,2"/>
  <polygon points="522,351 514,346 514,356" fill="#991b1b"/>
  <rect x="522" y="332" width="260" height="38" rx="7" ry="7" fill="#ffe4e6" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="652" y="347" text-anchor="middle" font-size="10" font-style="italic" fill="#9f1239">It may be time to talk about</text>
  <text x="652" y="362" text-anchor="middle" font-size="10" font-style="italic" fill="#9f1239">switching medications.</text>

  <!-- L4: center=396, card y=378, h=36 -->
  <rect x="220" y="378" width="280" height="36" rx="7" ry="7" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="234" y="392" font-size="11" font-weight="800" fill="#b91c1c">Level 4 - Big impact.</text>
  <text x="234" y="407" font-size="10.5" fill="#7f1d1d">Side effects are significantly affecting daily life.</text>

  <!-- L4 implication: center=396, bubble y=377, h=38 -->
  <line x1="500" y1="396" x2="516" y2="396" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="3,2"/>
  <polygon points="522,396 514,391 514,401" fill="#b91c1c"/>
  <rect x="522" y="377" width="260" height="38" rx="7" ry="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="652" y="392" text-anchor="middle" font-size="10" font-style="italic" fill="#b91c1c">We likely need to lower the dose.</text>

  <!-- L3: center=466, card y=441, h=50 -->
  <rect x="220" y="441" width="280" height="50" rx="7" ry="7" fill="#fff8f0" stroke="#fdba74" stroke-width="1.5"/>
  <text x="234" y="457" font-size="11" font-weight="800" fill="#c2410c">Level 3 - Medium impact.</text>
  <text x="234" y="474" font-size="10.5" fill="#92400e">Feeling like a lot to manage at this dose long term.</text>

  <!-- L3 implication: center=466, bubble y=447, h=50 -->
  <line x1="500" y1="466" x2="516" y2="466" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="3,2"/>
  <polygon points="522,466 514,461 514,471" fill="#c2410c"/>
  <rect x="522" y="441" width="260" height="50" rx="7" ry="7" fill="#ffedd5" stroke="#fdba74" stroke-width="1.3"/>
  <text x="652" y="457" text-anchor="middle" font-size="10" font-style="italic" fill="#c2410c">We should check in 2 weeks to see</text>
  <text x="652" y="472" text-anchor="middle" font-size="10" font-style="italic" fill="#c2410c">how my child is adjusting</text>
  <text x="652" y="487" text-anchor="middle" font-size="10" font-style="italic" fill="#c2410c">to the medication.</text>

  <!-- L2: center=556, card y=519, h=74 (3 lines including subclause) -->
  <rect x="220" y="519" width="280" height="74" rx="7" ry="7" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="234" y="537" font-size="11" font-weight="800" fill="#92400e">Level 2 - Medium impact, but tolerable.</text>
  <text x="234" y="554" font-size="10.5" fill="#78350f">Side effects affect parts of daily life,</text>
  <text x="234" y="569" font-size="10.5" fill="#78350f">but feel manageable.</text>
  <text x="234" y="586" font-size="10" fill="#92400e" font-style="italic">They may still improve as my child adjusts.</text>

  <!-- L1: center=676, card y=658, h=36 -->
  <rect x="220" y="658" width="280" height="36" rx="7" ry="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="234" y="672" font-size="11" font-weight="800" fill="#15803d">Level 1 - Small impact.</text>
  <text x="234" y="687" font-size="10.5" fill="#166534">Noticeable, but not interfering with daily life.</text>

  <!-- L0: center=826, card y=808, h=36 -->
  <rect x="220" y="808" width="280" height="36" rx="7" ry="7" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="234" y="822" font-size="12" font-weight="800" fill="#15803d">Level 0 - No side effects.</text>
  <text x="234" y="837" font-size="10.5" fill="#166534">My child is tolerating this dose well.</text>

  <!-- Footer -->
  <line x1="40" y1="960" x2="840" y2="960" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="978" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">Share this with your child's neurologist at your next visit.</text>

</svg>
